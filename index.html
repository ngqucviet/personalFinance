<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet</title>
    <link rel="icon" type="image/jpg" href="images/logo.jpg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Left column: Data entry & history -->
        <div class="column left-col">
            <div class="entry-section">
                <h2>Data</h2>

                <div class="filter-section">
                    <label for="month-filter">Tracked month:</label>
                    <input type="month" id="month-filter">
                </div>

                <form id="finance-form">
                    <div id="edit-banner" class="edit-banner" style="display: none;">
                        Editing transaction
                    </div>

                    <label for="transaction-type">Transaction</label>
                    <select id="transaction-type" onchange="toggleAccountSelect()">
                        <option value="income">Income (+)</option>
                        <option value="expense">Expense (-)</option>
                        <option value="transfer">Transfer</option>
                    </select>

                    <div id="account-select-container">
                        <label id="account-label" for="account-type-select">From:</label>
                        <select id="account-type-select" required></select>

                        <!-- Expense category (Shown only for Expense) -->
                        <div id="liability-group" style="margin-top: 10px; display: none;">
                            <label for="liability-account-select">Purpose:</label>
                            <select id="liability-account-select"></select>
                        </div>

                        <!-- Destination account (Shown only for Transfer) -->
                        <div id="transfer-destination-container" style="margin-top: 10px; display: none;">
                            <label for="transfer-destination-select">To:</label>
                            <select id="transfer-destination-select"></select>
                        </div>
                    </div>

                    <input type="date" id="date-input" required>
                    <input type="text" id="desc" placeholder="Description (e.g., Shopping)" required>
                    <input type="number" id="amount" placeholder="Amount (VND)" min="1" step="any" required>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn">Add</button>
                        <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display: none;" onclick="cancelEdit()">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="history">
                <h3>History</h3>
                <div class="history-filters">
                    <input type="text" id="history-search" placeholder="Search description or account...">
                    <select id="history-type-filter" aria-label="Filter by transaction type">
                        <option value="all">All types</option>
                        <option value="income">Income (+)</option>
                        <option value="expense">Expense (-)</option>
                        <option value="transfer">Transfer (⇄)</option>
                    </select>
                </div>
                <ul id="transaction-list"></ul>
            </div>

            <hr class="section-divider">

            <div class="account-manager">
                <h3>Account list</h3>
                <div class="account-input-group">
                    <input type="text" id="new-account-name" placeholder="Account name">
                    <select id="new-account-type">
                        <option value="asset">Asset</option>
                        <option value="liability">Expense</option>
                    </select>
                    <button type="button" onclick="addAccountType()">+ Add</button>
                </div>
                <ul id="account-list-manage"></ul>
            </div>

            <hr class="section-divider">

            <div class="backup-manager">
                <h3>Backup &amp; Restore (Excel)</h3>
                <div class="backup-actions">
                    <button type="button" class="btn-outline" onclick="exportToExcel()">Export Excel (.xlsx)</button>
                    <button type="button" class="btn-outline" onclick="triggerImportExcel()">Restore Excel (.xlsx)</button>
                    <input type="file" id="excel-import-input" accept=".xlsx,.xls" style="display: none;">
                </div>
            </div>
        </div>

        <!-- Right column: Financial report -->
        <div class="column right-col">
            <h2 id="current-view-title">Financial report</h2>
            <div class="balance-sheet">
                <div id="chart-container" class="chart-container">
                    <canvas id="expenseChart"></canvas>
                    <p id="chart-empty-msg" class="empty-msg" style="display: none;">No expenses recorded for this month.</p>
                </div>

                <div id="balance-sheet-content"></div>
                <div class="row total">
                    <span>TOTAL ASSETS</span>
                    <span id="total-sum">0đ</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
